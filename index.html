const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Persistência (localStorage) — sobrevive a navegação e reload ---------- */
const STORE_PREFIX = "tfmcfn2026:";
function loadStore(key, fallback) {
  try {
    const raw = localStorage.getItem(STORE_PREFIX + key);
    return raw != null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveStore(key, value) {
  try {
    localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value));
  } catch (e) {}
}
function usePersist(key, initial) {
  const [state, setState] = useState(() => loadStore(key, initial));
  useEffect(() => {
    saveStore(key, state);
  }, [key, state]);
  return [state, setState];
}
function range(n) {
  return Array.from({ length: n }, (_, i) => i);
}

/* ---------- Motor de quiz genérico ---------- */
/* results: { [idx]: { answered, correct, user, marked } } */
function useQuiz(total, key) {
  const [order, setOrder] = usePersist(key + ":order", range(total));
  const [pos, setPos] = usePersist(key + ":pos", 0);
  const [results, setResults] = usePersist(key + ":res", {});
  const [finished, setFinished] = usePersist(key + ":fin", false);

  const idx = order[Math.min(pos, order.length - 1)];
  const cur = results[idx] || {};

  function record(data) {
    setResults((r) => ({ ...r, [idx]: { ...(r[idx] || {}), ...data } }));
  }
  function toggleMark() {
    setResults((r) => ({ ...r, [idx]: { ...(r[idx] || {}), marked: !(r[idx] && r[idx].marked) } }));
  }
  function next() {
    if (pos < order.length - 1) setPos(pos + 1);
    else setFinished(true);
  }
  function prev() {
    if (finished) { setFinished(false); return; }
    if (pos > 0) setPos(pos - 1);
  }
  function restartAll() {
    setOrder(range(total)); setPos(0); setResults({}); setFinished(false);
  }
  function redoSubset(indices) {
    if (!indices.length) return;
    setOrder(indices);
    setPos(0);
    setResults((r) => {
      const nr = { ...r };
      indices.forEach((i) => { delete nr[i]; });
      return nr;
    });
    setFinished(false);
  }
  const wrong = Object.keys(results).filter((k) => results[k].answered && results[k].correct === false).map(Number);
  const marked = Object.keys(results).filter((k) => results[k].marked).map(Number);
  const answeredCount = Object.keys(results).filter((k) => results[k].answered).length;

  return { order, pos, idx, cur, finished, record, toggleMark, next, prev, restartAll, redoSubset, wrong, marked, answeredCount, setFinished };
}

/* ---------- Cartão de fim de questionário (reutilizável) ---------- */
function FinalCard({ q, resultsAll, scored, onRedoAll }) {
  const answered = q.order.filter((i) => resultsAll[i] && resultsAll[i].answered);
  const correct = q.order.filter((i) => resultsAll[i] && resultsAll[i].correct === true).length;
  const wrong = q.wrong;
  const marked = q.marked;
  return (
    <div style={S.card}>
      <h2 style={{ ...S.h2, marginTop: 0 }}>✅ Questionário concluído!</h2>
      {scored ? (
        <p style={S.p}>Você acertou <b style={{ color: C.green }}>{correct}</b> de <b>{answered.length}</b> respondidas.</p>
      ) : (
        <p style={S.p}>Você respondeu <b>{answered.length}</b> de <b>{q.order.length}</b>.</p>
      )}
      <div>
        {scored && wrong.length > 0 && (
          <button style={{ ...S.btn, background: C.red, color: "#fff" }} onClick={() => q.redoSubset(wrong)}>🔁 Refazer erradas ({wrong.length})</button>
        )}
        {marked.length > 0 && (
          <button style={{ ...S.btn, background: C.blue, color: "#fff" }} onClick={() => q.redoSubset(marked)}>🔁 Refazer marcadas ({marked.length})</button>
        )}
        <button style={S.btnGhost} onClick={() => { q.restartAll(); onRedoAll && onRedoAll(); }}>↺ Recomeçar tudo</button>
        <button style={S.btnGhost} onClick={() => q.setFinished(false)}>← Revisar respostas</button>
      </div>
    </div>
  );
}

/* ---------- MAPA MENTAL (interativo/expansível) ---------- */
function MapNode({ node, depth, path, openSet, toggle }) {
  const has = node.filhos && node.filhos.length > 0;
  const isOpen = openSet[path];
  const colors = [C.gold, C.olive, C.blue, C.goldSoft];
  const col = colors[depth % colors.length];
  return (
    <div style={{ marginLeft: depth === 0 ? 0 : 16, marginTop: 4 }}>
      <div
        onClick={() => has && toggle(path)}
        style={{
          display: "flex", alignItems: "center", gap: 8, cursor: has ? "pointer" : "default",
          background: depth === 0 ? "linear-gradient(90deg,#12345c,#122844)" : C.card2,
          border: "1px solid " + (depth === 0 ? C.gold : C.border),
          borderLeft: "4px solid " + col,
          borderRadius: 10, padding: depth === 0 ? "12px 14px" : "9px 12px", marginBottom: 4,
        }}
      >
        {has && <span style={{ color: col, fontWeight: 800, width: 14 }}>{isOpen ? "▾" : "▸"}</span>}
        {!has && <span style={{ color: col, width: 14, textAlign: "center" }}>•</span>}
        <span style={{ fontSize: depth === 0 ? 16 : 14.5, fontWeight: depth <= 1 ? 700 : 500, color: C.text }}>{node.nome}</span>
      </div>
      {has && isOpen && (
        <div style={{ borderLeft: "1px dashed " + C.border, marginLeft: 6 }}>
          {node.filhos.map((f, i) => (
            <MapNode key={i} node={f} depth={depth + 1} path={path + "." + i} openSet={openSet} toggle={toggle} />
          ))}
        </div>
      )}
    </div>
  );
}
function MapaMental() {
  const [openSet, setOpenSet] = usePersist("mapa:open", { "0": true });
  function toggle(path) {
    setOpenSet((s) => ({ ...s, [path]: !s[path] }));
  }
  function expandAll(val) {
    const all = {};
    function walk(node, path) {
      all[path] = val;
      (node.filhos || []).forEach((f, i) => walk(f, path + "." + i));
    }
    walk(MAPA_MENTAL, "0");
    setOpenSet(all);
  }
  return (
    <div>
      <h1 style={S.h1}>🧭 Mapa Mental Interativo</h1>
      <div style={{ marginBottom: 12 }}>
        <button style={S.btnSm} onClick={() => expandAll(true)}>Expandir tudo</button>
        <button style={S.btnSm} onClick={() => expandAll(false)}>Recolher tudo</button>
      </div>
      <div style={S.card}>
        <MapNode node={MAPA_MENTAL} depth={0} path="0" openSet={openSet} toggle={toggle} />
      </div>
    </div>
  );
}

/* ---------- CONSULTA (busca) ---------- */
function highlight(text, term) {
  if (!term) return text;
  const parts = text.split(new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"));
  return parts.map((p, i) =>
    p.toLowerCase() === term.toLowerCase() ? <mark key={i} style={{ background: C.gold, color: "#20180a", borderRadius: 3, padding: "0 2px" }}>{p}</mark> : p
  );
}
function Consulta() {
  const [term, setTerm] = usePersist("consulta:term", "");
  const t = term.trim().toLowerCase();
  const res = CONSULTA.filter((x) => !t || x.t.toLowerCase().includes(t) || x.c.toLowerCase().includes(t));
  return (

      <p style={S.dim}>Digite uma palavra (ex.: "valsalva", "natação", "FCM", "aquecimento").</p>

      {res.map((x, i) => (
        <div key={i} style={S.card}>
          <h3 style={S.h3}>{highlight(x.t, term.trim())}</h3>
          <p style={{ ...S.p, margin: 0 }}>{highlight(x.c, term.trim())}</p>
        </div>
      ))}
      {res.length === 0 && <div style={S.card}>Nenhum resultado. Tente outra palavra.</div>}
    </div>
  );
}

/* ---------- FLASHCARDS ---------- */
function Flashcards() {
  const total = FLASHCARDS.length;
  const [order, setOrder] = usePersist("fc:order", range(total));
  const [pos, setPos] = usePersist("fc:pos", 0);
  const [flipped, setFlipped] = usePersist("fc:flip", false);
  const [status, setStatus] = usePersist("fc:status", {}); // idx -> 'sabia'|'nao'
  const [showHint, setShowHint] = usePersist("fc:hint", false);
  const [picking, setPicking] = usePersist("fc:pick", true);

  const idx = order[Math.min(pos, order.length - 1)];
  const card = FLASHCARDS[idx];
  const naoSabia = Object.keys(status).filter((k) => status[k] === "nao").map(Number);
  const sabia = Object.keys(status).filter((k) => status[k] === "sabia").length;

  function mark(v) {
    setStatus((s) => ({ ...s, [idx]: v }));
    setTimeout(() => nextCard(), 120);
  }
  function nextCard() {
    setFlipped(false); setShowHint(false);
    if (pos < order.length - 1) setPos(pos + 1);
  }
  function prevCard() {
    setFlipped(false); setShowHint(false);
    if (pos > 0) setPos(pos - 1);
  }
  function startFrom(i) {
    setOrder(range(total)); setPos(i); setFlipped(false); setShowHint(false); setPicking(false);
  }
  function reviewNao() {
    if (!naoSabia.length) return;
    setOrder(naoSabia); setPos(0); setFlipped(false); setShowHint(false); setStatus((s) => {
      const ns = { ...s }; naoSabia.forEach((i) => delete ns[i]); return ns;
    }); setPicking(false);
  }
  function restart() {
    setOrder(range(total)); setPos(0); setFlipped(false); setStatus({}); setShowHint(false); setPicking(false);
  }

  if (picking) {
    return (
      <div>
        <h1 style={S.h1}>🎴 Flashcards</h1>
        <p style={S.dim}>Escolha a partir de qual flashcard começar:</p>
        <div style={S.card}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(46px,1fr))", gap: 8 }}>
            {FLASHCARDS.map((c, i) => (
              <button key={i} title={c.f} style={{ ...S.btnSm, margin: 0, textAlign: "center" }} onClick={() => startFrom(i)}>{i + 1}</button>
            ))}
          </div>
          <button style={{ ...S.btn, marginTop: 14 }} onClick={() => startFrom(0)}>Começar do 1</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <h1 style={S.h1}>🎴 Flashcards</h1>
      <Counter pos={pos} total={order.length} extra={"✔ " + sabia + "  ✖ " + naoSabia.length} />
      <Bar done={pos} total={order.length} />
      <div
        onClick={() => setFlipped(!flipped)}
        style={{
          ...S.card, minHeight: 170, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",
          textAlign: "center", cursor: "pointer", borderColor: flipped ? C.green : C.gold,
          background: flipped ? "linear-gradient(135deg,#123a2a,#0f2138)" : "linear-gradient(135deg,#12345c,#122844)",
        }}
      >
        <div style={{ ...S.dim, marginBottom: 8 }}>{flipped ? "VERSO (resposta)" : "FRENTE — toque para virar"}</div>
        <div style={{ fontSize: 18, fontWeight: 700, color: C.text, padding: "0 6px" }}>{flipped ? card.v : card.f}</div>
        {flipped && (
          <div style={{ marginTop: 12, width: "100%" }}>
            <GabaritoBox label="DEFINIÇÃO RESUMIDA" tone="resumo">{card.def}</GabaritoBox>
            <MemoBox>{card.dica}</MemoBox>
          </div>
        )}
      </div>
      <Hint text={card.dica} show={showHint} onToggle={() => setShowHint(!showHint)} />
      <div style={{ marginTop: 12 }}>
        <button style={S.btnGhost} onClick={prevCard} disabled={pos === 0}>← Anterior</button>
        {!flipped && <button style={S.btn} onClick={() => setFlipped(true)}>Ver resposta</button>}
        {flipped && <button style={{ ...S.btn, background: C.green, color: "#fff" }} onClick={() => mark("sabia")}>✔ Sabia</button>}
        {flipped && <button style={{ ...S.btn, background: C.red, color: "#fff" }} onClick={() => mark("nao")}>✖ Não sabia</button>}
        <button style={S.btnGhost} onClick={nextCard} disabled={pos >= order.length - 1}>Pular →</button>
      </div>
      <div style={{ marginTop: 14 }}>
        <button style={S.btnSm} onClick={reviewNao} disabled={!naoSabia.length}>🔁 Rever "não sabia" ({naoSabia.length})</button>
        <button style={S.btnSm} onClick={() => setPicking(true)}>🎯 Escolher card inicial</button>
        <button style={S.btnSm} onClick={restart}>↺ Recomeçar</button>
      </div>
    </div>
  );
}

/* ---------- V ou F (por itens) ---------- */
function VouF() {
  const q = useQuiz(VOUF.length, "vf");

  if (q.finished) return <div><h1 style={S.h1}>✔️ Verdadeiro ou Falso</h1><FinalCard q={q} resultsAll={loadStore("vf:res", {})} scored /></div>;
  const item = VOUF[q.idx];
  const answered = q.cur.answered;
  const marks = q.cur.marks || {}; // itemIndex -> true/false
  function setMark(i, v) { if (!answered) q.record({ marks: { ...marks, [i]: v } }); }

    const allDone = item.itens.every((_, i) => marks[i] != null);

    const correct = item.itens.every((it, i) => marks[i] === it.v);
    q.record({ answered: true, correct });

  return (
    <div>
      <h1 style={S.h1}>✔️ Verdadeiro ou Falso</h1>
      <Counter pos={q.pos} total={q.order.length} extra={item.titulo} />
      <Bar done={q.answeredCount} total={VOUF.length} />
      <div style={S.card}>

          const chosen = marks[i];

/* ---------- COMPLETE AS LACUNAS ---------- */
function Lacunas() {
  const q = useQuiz(LACUNAS.length, "lac");
  const [showHint, setShowHint] = useState(false);
  useEffect(() => { setShowHint(false); }, [q.idx, q.finished]);
  if (q.finished) return <div><h1 style={S.h1}>✏️ Complete as Lacunas</h1><FinalCard q={q} resultsAll={loadStore("lac:res", {})} scored /></div>;
  const item = LACUNAS[q.idx];
  const answered = q.cur.answered;
  const inputs = q.cur.inputs || item.respostas.map(() => "");
  const partes = item.texto.split("___");
  function setInput(i, v) { if (!answered) q.record({ inputs: inputs.map((x, k) => (k === i ? v : x)) }); }
  function norm(s) { return (s || "").trim().toLowerCase().replace(/\.$/, ""); }
  function confirm() {
    const correct = item.respostas.every((r, i) => norm(inputs[i]) === norm(r));
    q.record({ answered: true, correct });
  }
  return (
    <div>
      <h1 style={S.h1}>✏️ Complete as Lacunas</h1>
      <Counter pos={q.pos} total={q.order.length} />
      <Bar done={q.answeredCount} total={LACUNAS.length} />
      <div style={S.card}>
        <div style={{ fontSize: 16, lineHeight: 2, marginBottom: 8 }}>
          {partes.map((seg, i) => (
            <span key={i}>
              {seg}
              {i < item.respostas.length && (
                <input value={inputs[i]} onChange={(e) => setInput(i, e.target.value)} disabled={answered}
                  style={{ ...S.input, display: "inline-block", width: 130, padding: "4px 8px", margin: "0 4px",
                    borderColor: answered ? (norm(inputs[i]) === norm(item.respostas[i]) ? C.green : C.red) : C.gold }} />
              )}
            </span>
          ))}
        </div>
        {!answered && <Hint text={"São " + item.respostas.length + " lacuna(s)."} show={showHint} onToggle={() => setShowHint(!showHint)} />}
        {answered && (
          <div>
            <GabaritoBox label="GABARITO">{item.respostas.join(" · ")}</GabaritoBox>
            <MemoBox>{item.memo}</MemoBox>
          </div>
        )}
      </div>
      <NavRow q={q}>
        {!answered ? <button style={S.btn} onClick={confirm}>Confirmar</button>
          : <button style={S.btn} onClick={q.next}>{q.pos < q.order.length - 1 ? "Próxima →" : "Finalizar ✓"}</button>}
      </NavRow>
    </div>
  );
}

/* ---------- CORRELACIONE ---------- */
function Correlacione() {
  const q = useQuiz(CORRELACIONE.length, "cor");
  const [showHint, setShowHint] = useState(false);
  const [sel, setSel] = useState(null);
  useEffect(() => { setShowHint(false); setSel(null); }, [q.idx, q.finished]);
  if (q.finished) return <div><h1 style={S.h1}>🔗 Correlacione</h1><FinalCard q={q} resultsAll={loadStore("cor:res", {})} scored /></div>;
  const item = CORRELACIONE[q.idx];
  const answered = q.cur.answered;
  // map: rightIndex -> leftNumber (1-based) OR "-"
  const map = q.cur.map || {};
  function assign(rightIdx) {
    if (answered || sel == null) return;
    const nm = { ...map };
    Object.keys(nm).forEach((k) => { if (nm[k] === sel + 1) delete nm[k]; });
    nm[rightIdx] = sel + 1;
    q.record({ map: nm });
    setSel(null);
  }
  function confirm() {
    // correct if for each left i, the right index gabarito[i] has value i+1, and false answer stays unassigned or "-"
    let correct = true;
    item.esquerda.forEach((_, i) => {
      const rightIdx = item.gabarito[i];
      if (map[rightIdx] !== i + 1) correct = false;
    });
    q.record({ answered: true, correct });
  }
  const falseIndexes = item.direita.map((_, i) => i).filter((i) => !item.gabarito.includes(i));
  return (
    <div>
      <h1 style={S.h1}>🔗 Correlacione</h1>
      <Counter pos={q.pos} total={q.order.length} extra={item.titulo} />
      <Bar done={q.answeredCount} total={CORRELACIONE.length} />
      <div style={S.card}>
        <div style={{ ...S.dim, marginBottom: 8 }}>Toque num item numerado à esquerda e depois na resposta à direita. Uma resposta é FALSA (fica como "-").</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 12 }}>
          <div>
            {item.esquerda.map((e, i) => (
              <div key={i} onClick={() => !answered && setSel(i)}
                style={{ background: sel === i ? "#12345c" : C.card2, border: "1px solid " + (sel === i ? C.gold : C.border), borderRadius: 8, padding: "9px 10px", marginBottom: 8, cursor: answered ? "default" : "pointer", display: "flex", gap: 8 }}>
                <b style={{ color: C.gold }}>{i + 1}</b><span style={{ fontSize: 14 }}>{e}</span>
              </div>
            ))}
          </div>
          <div>
            {item.direita.map((d, ri) => {
              const val = map[ri];
              const isFalse = falseIndexes.includes(ri);
              let bd = C.border, bg = C.card2;
              if (answered) {
                const correctNum = item.gabarito.indexOf(ri); // left index that should map here
                if (correctNum >= 0) { if (val === correctNum + 1) { bg = C.greenBg; bd = C.green; } else { bg = C.redBg; bd = C.red; } }
                else { if (val) { bg = C.redBg; bd = C.red; } }
              } else if (val) { bd = C.gold; }
              return (
                <div key={ri} onClick={() => assign(ri)}
                  style={{ background: bg, border: "1px solid " + bd, borderRadius: 8, padding: "9px 10px", marginBottom: 8, cursor: answered ? "default" : "pointer", display: "flex", gap: 8, alignItems: "center" }}>
                  <b style={{ color: val ? C.gold : C.dim, minWidth: 16 }}>{answered && isFalse ? "-" : (val || "?")}</b>
                  <span style={{ fontSize: 14 }}>{d}</span>
                </div>
              );
            })}
          </div>
        </div>
        {!answered && <Hint text={"O correto na coluna da direita é o número correspondente à esquerda; a resposta falsa recebe \"-\"."} show={showHint} onToggle={() => setShowHint(!showHint)} />}
        {answered && (
          <div>
            <GabaritoBox label="GABARITO">
              {item.esquerda.map((e, i) => <div key={i}>{i + 1} → {item.direita[item.gabarito[i]]}</div>)}
              <div style={{ color: C.dim, marginTop: 4 }}>Falsa (-): {item.direita[falseIndexes[0]]}</div>
            </GabaritoBox>
            <MemoBox>{item.memo}</MemoBox>
          </div>
        )}
      </div>
      <NavRow q={q}>
        {!answered ? <button style={S.btn} onClick={confirm}>Confirmar</button>
          : <button style={S.btn} onClick={q.next}>{q.pos < q.order.length - 1 ? "Próximo →" : "Finalizar ✓"}</button>}
      </NavRow>
    </div>
  );
}

/* ---------- ESCRITA (Definições / Cite / Liste / Complete) ---------- */
function EscritaQuiz({ titulo, storeKey, items, renderGabarito, promptOf }) {
  const q = useQuiz(items.length, storeKey);
  const [showHint, setShowHint] = useState(false);
  useEffect(() => { setShowHint(false); }, [q.idx, q.finished]);
  if (q.finished) return <div><h1 style={S.h1}>{titulo}</h1><FinalCard q={q} resultsAll={loadStore(storeKey + ":res", {})} scored={false} /></div>;
  const item = items[q.idx];
  const answered = q.cur.answered;
  const text = q.cur.user || "";
  return (
    <div>
      <h1 style={S.h1}>{titulo}</h1>
      <Counter pos={q.pos} total={q.order.length} />
      <Bar done={q.answeredCount} total={items.length} />
      <div style={S.card}>
        <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 10 }}>{promptOf(item)}</div>
        <textarea style={{ ...S.input, minHeight: 90 }} placeholder="Escreva sua resposta..." value={text} disabled={answered} onChange={(e) => q.record({ user: e.target.value })} />
        {!answered && <Hint text={item.dica || "Tente responder de memória antes de conferir."} show={showHint} onToggle={() => setShowHint(!showHint)} />}
        {answered && (
          <div>
            <GabaritoBox label="GABARITO">{renderGabarito(item)}</GabaritoBox>
            {item.resumo && <GabaritoBox label="GABARITO RESUMIDO" tone="resumo">{item.resumo}</GabaritoBox>}
            <MemoBox>{item.memo}</MemoBox>
            {text && <div style={{ ...S.dim, marginTop: 8 }}>Sua resposta: <span style={{ color: C.text }}>{text}</span></div>}
          </div>
        )}
      </div>
      <NavRow q={q}>
        {!answered ? <button style={S.btn} onClick={() => q.record({ answered: true })}>Confirmar / Ver gabarito</button>
          : <button style={S.btn} onClick={q.next}>{q.pos < q.order.length - 1 ? "Próxima →" : "Finalizar ✓"}</button>}
      </NavRow>
    </div>
  );
}

function Definicoes() {
  return <EscritaQuiz titulo="📚 Definições" storeKey="def" items={DEFINICOES}
    promptOf={(it) => "Defina: " + it.termo}

}

}
