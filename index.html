alva = bloqueio da respira\xE7\xE3o \u2192 aumenta a press\xE3o arterial.","Benef\xEDcios do aquecimento: reduz viscosidade sangu\xEDnea, lubrifica articula\xE7\xF5es, estimula o sistema energ\xE9tico."]},{bloco:"2. Princ\xEDpios do Treinamento",itens:["S\xE3o 6: Individualidade, Adapta\xE7\xE3o, Sobrecarga, Interdepend\xEAncia V\xD7I, Continuidade, Especificidade.","Individualidade Biol\xF3gica: Gen\xF3tipo + Fen\xF3tipo; mesmo treino = efeitos diferentes.","Adapta\xE7\xE3o: Treino \u2192 Est\xEDmulo \u2192 Adapta\xE7\xE3o metab\xF3lica e fisiol\xF3gica.","Sobrecarga: impor estresse crescente (aumentar volume OU intensidade).","Interdepend\xEAncia V\xD7I: volume e intensidade s\xE3o inversamente proporcionais.","Continuidade: efeitos s\xE3o transit\xF3rios e revers\xEDveis (revertem com inatividade).","Especificidade: efeitos espec\xEDficos para o que \xE9 solicitado (correr para corrida etc.).","Aer\xF3bio: 15 a 60 min; intensidade 55 a 90% da FC m\xE1xima; FC \xE9 \xF3timo par\xE2metro."]},{bloco:"3. Treinamento Cardiovascular",itens:["Conceito: predomin\xE2ncia do sistema energ\xE9tico aer\xF3bio.","Aer\xF3bico (3.6): corrida, nata\xE7\xE3o, ciclismo, lutas \u2014 20 a 60 min.","Corrida: pelo menos 2x/semana. Nata\xE7\xE3o: 2x/semana, dias n\xE3o consecutivos, m\xEDnimo 500 m.","FC: medir 15 s em repouso \xD7 4 = BPM. FCM = 220 \u2212 idade.","M\xE9todo CONT\xCDNUO (predom\xEDnio do volume): Fartlek (40\u2013120 min) e Cross-promenade (m\xEDn. 3 km, 40\u201390 min).","M\xE9todo INTERVALADO: tiros/arrancadas; at\xE9 5 min; 10 a 60 rep; recupera\xE7\xE3o incompleta.","M\xE9todo FRACIONADO: 2\xBA est\xEDmulo ap\xF3s recupera\xE7\xE3o quase total do 1\xBA.","Benef\xEDcios: reduz gordura, reduz PA e riscos card\xEDacos, usa mais gordura como energia, aumenta economia de movimento."]},{bloco:"4. Treinamento de For\xE7a",itens:["For\xE7a = resist\xEAncia aplicada ao sistema neuromuscular.","Tipos: Pura (movimentos ac\xEDclicos), Din\xE2mica (massa muscular), Explosiva (pot\xEAncia), RML (t\xF4nus/resist\xEAncia).","M\xE9todos: Circuito, TRM, Funcional, Muscula\xE7\xE3o.","Circuito: 6 a 15 esta\xE7\xF5es, alternar bra\xE7o/perna, 1 a 3 voltas, 2 a 3x/semana.","TRM: b\xE1sico (peso corporal/companheiro) e avan\xE7ado (barras, anilhas, toros, fuzil); 3 fases; repeti\xE7\xE3o tern\xE1ria (1,2,3,0).","Funcional: princ\xEDpio da instabilidade mec\xE2nica \u2192 est\xEDmulo sens\xF3rio-motor.","Muscula\xE7\xE3o: treino de for\xE7a em sala de equipamentos."]},{bloco:"5. Gin\xE1stica Preparat\xF3ria e Condu\xE7\xE3o",itens:["Sess\xE3o (cap 3): aquecimento articular, alongamento, aquecimento dos grupos musculares, aer\xF3bico, neuromusculares, volta \xE0 calma.","Gin\xE1stica Preparat\xF3ria visa o aquecimento propriamente dito.","Alongamento inicial: passivo/est\xE1tico, ~10 min \u2192 aquecimento articular + alongamento pr\xE9vio muscular.","Aquecimento articular: de baixo para cima; unilateral come\xE7ando pela ESQUERDA; ~8 giros lentos.","Volta \xE0 calma: 5 a 15 min; 30 s a 1 min por grupamento muscular.","Crit\xE9rios de condu\xE7\xE3o: Uniforme, Postura, Voz de comando, Ser claro, Seguran\xE7a.","Usar: afastar, aproximar, flexionar, estender. Evitar: abrir, fechar, dobrar.","Vocativos: 'Permiss\xE3o para iniciar\u2026' / 'Pronto da Gin\xE1stica Preparat\xF3ria B\xE1sica'."]},{bloco:"6. Legisla\xE7\xE3o (TAF-A) e Aspecto Militar",itens:["TFM di\xE1rio; excepcionalmente no m\xEDnimo 3x/semana (1.2.3).","Comandante/Diretor respons\xE1vel pela higidez f\xEDsica (1.2.11).","50 anos ou mais: desobrigados do TAF-a (1.2.12).","TAF-a at\xE9 20 de outubro (5.2.1). Local: pista/\xE1rea plana + piscina de 50 ou 25 m.","Modalidades CFN em 3 dias n\xE3o consecutivos: corrida, nata\xE7\xE3o, perman\xEAncia na \xE1gua, barra/flex\xE3o, abdominal.","Impedimento: realiza quando o motivo cessar; resultado retroativo \xE0 data do teste regular.","CFN envia por of\xEDcio ao CPesFN at\xE9 31/10, com c\xF3pia ao CEFAN (5.7.2).","Aspecto Militar (composi\xE7\xE3o corporal): avaliado em set/out; 'insuficiente' \u2192 MSG ao CEFAN at\xE9 31OUT + imers\xE3o de 2 semanas."]}],W0=[{titulo:"Bloco 1 \u2014 Seguran\xE7a e Higiene",paragrafos:["O papel do TFM: a melhoria da aptid\xE3o f\xEDsica aumenta a prontid\xE3o para o combate; indiv\xEDduos aptos s\xE3o mais resistentes a doen\xE7as e se recuperam mais r\xE1pido de les\xF5es.","Conceito atual de sa\xFAde (2.2): completo bem-estar f\xEDsico e mental \u2014 n\xE3o apenas aus\xEAncia de enfermidade. O programa de treino deve buscar for\xE7a muscular, resist\xEAncia aer\xF3bica, flexibilidade e manuten\xE7\xE3o da composi\xE7\xE3o corporal adequada \xE0 massa e \xE0 idade.","Realiza\xE7\xE3o do TFM: os militares devem estar APTOS nas Inspe\xE7\xF5es de Sa\xFAde (1.2.6). O TFM deve ocorrer em local que evite acidentes e com ventila\xE7\xE3o adequada (1.2.7). Anualmente, at\xE9 31/03, todas as OM efetuam o Pr\xE9-TAF-a, cujos resultados dividem os militares por turmas e dimensionam a carga (1.2.10). O hor\xE1rio \xE9, de prefer\xEAncia, pela manh\xE3; quando n\xE3o for poss\xEDvel, deve iniciar cerca de 2h ap\xF3s as principais refei\xE7\xF5es (almo\xE7o e jantar) (1.2.8). Em temperaturas muito baixas ou elevadas, treinar nos hor\xE1rios de temperatura amena, atentando tamb\xE9m \xE0 umidade relativa do ar.","Dieta (2.3): emagrecimento/ganho ocorre por balan\xE7o energ\xE9tico. N\xE3o praticar atividade em jejum (pode levar \xE0 hipoglicemia e desmaios). Realizar refei\xE7\xE3o leve 30 min antes do exerc\xEDcio e hidratar-se consumindo 35 mL por kg de peso corporal.","For\xE7a com seguran\xE7a (2.5.6): (a) t\xE9cnica adequada de levantamento; (b) evitar elevar pesos acima do prescrito pelo Instrutor/Guia; (c) respira\xE7\xE3o correta, evitando a Manobra de Valsalva \u2014 bloqueio da respira\xE7\xE3o que aumenta a press\xE3o arterial durante o exerc\xEDcio.","Cardiovascular com seguran\xE7a: o mioc\xE1rdio \xE9 o m\xFAsculo mais importante do corpo e precisa ser exercitado. A FC (2.6.2) \xE9 par\xE2metro para controlar a intensidade: medida em p\xE9, sentado ou deitado, durante 15 s em repouso, multiplicando-se o resultado por 4 (BPM). Normas de execu\xE7\xE3o: n\xE3o executar ap\xF3s almo\xE7o e jantar; permanecer 3 semanas em cada n\xEDvel; executar aquecimento, gin\xE1stica preparat\xF3ria e volta \xE0 calma; ingerir \xE1gua antes e depois; medir a FC antes e imediatamente ap\xF3s. Interrup\xE7\xE3o de at\xE9 3 semanas \u2192 reinicia na 1\xAA semana do n\xEDvel interrompido; superior a 3 semanas \u2192 reinicia na 1\xAA semana do n\xEDvel anterior. Benef\xEDcios do aquecimento (3.6.1): redu\xE7\xE3o da viscosidade sangu\xEDnea, lubrifica\xE7\xE3o das articula\xE7\xF5es e est\xEDmulo do sistema energ\xE9tico a ser solicitado."]},{titulo:"Bloco 2 \u2014 Princ\xEDpios do Treinamento F\xEDsico",paragrafos:["S\xE3o seis princ\xEDpios: Individualidade Biol\xF3gica, Adapta\xE7\xE3o, Sobrecarga, Interdepend\xEAncia Volume-Intensidade, Continuidade e Especificidade.","Individualidade Biol\xF3gica: cada ser humano possui estrutura e forma\xE7\xE3o f\xEDsica pr\xF3prias (Gen\xF3tipo + Fen\xF3tipo). Um mesmo treino gera efeitos diferentes para cada indiv\xEDduo; a divis\xE3o em grupos homog\xEAneos facilita o treinamento.","Adapta\xE7\xE3o: o organismo estimulado produz adapta\xE7\xF5es metab\xF3licas e fisiol\xF3gicas \u2014 Treino \u2192 Est\xEDmulo \u2192 Adapta\xE7\xE3o.","Sobrecarga: os est\xEDmulos devem impor estresse crescente; cargas constantes deixam de gerar efeito. Aumenta-se o VOLUME (mais repeti\xE7\xF5es, mais dias, maior dist\xE2ncia, mais tempo) ou a INTENSIDADE (mais peso, maior amplitude, maior velocidade, menor intervalo).","Interdepend\xEAncia Volume-Intensidade: as duas vari\xE1veis s\xE3o inversamente proporcionais \u2014 quando o volume aumenta, a intensidade diminui e vice-versa.","Continuidade (e reversibilidade): os efeitos do treinamento s\xE3o transit\xF3rios e revers\xEDveis; revertem-se caso o indiv\xEDduo se torne inativo.","Especificidade: os efeitos s\xE3o espec\xEDficos para as partes e sistemas solicitados (para melhorar a corrida deve-se correr; a nata\xE7\xE3o, nadar).","Componentes essenciais: treinos aer\xF3bios recrutam grande massa muscular (2.4.1); dura\xE7\xE3o de 15 a 60 min (cont\xEDnua ou intervalada); intensidade entre 55 e 90% da FC m\xE1xima. A FC \xE9 \xF3timo par\xE2metro (2.6.2) e a intensidade \xE9 dividida em zonas-alvo (2.6.3)."]},{titulo:"Bloco 3 \u2014 Treinamento Cardiovascular",paragrafos:["Conceito: treinos diversos com predomin\xE2ncia do sistema energ\xE9tico aer\xF3bio na produ\xE7\xE3o de energia. O treinamento aer\xF3bico (3.6) compreende corrida, nata\xE7\xE3o, ciclismo e lutas, com dura\xE7\xE3o de 20 a 60 min.","Corrida (4.5.1): deve constar nos programas com frequ\xEAncia de pelo menos 2 vezes/semana. Nata\xE7\xE3o: pelo menos 2x/semana, em dias n\xE3o consecutivos, nadando ao menos 500 m em cada.","Fatores de influ\xEAncia nos treinos: (I) n\xEDvel inicial \u2192 individualidade biol\xF3gica; (II) intensidade \u2192 sobrecarga; (III) volume \u2192 sobrecarga; (IV) frequ\xEAncia semanal; (V) m\xE9todo de treinamento.","FC: medida durante 15 s em repouso, multiplicada por 4 = BPM. FCM = 220 \u2212 idade. Volume aumenta \u2192 intensidade diminui e vice-versa.","M\xE9todo CONT\xCDNUO (predom\xEDnio do volume): Fartlek \u2014 corrida de dist\xE2ncias e velocidades vari\xE1veis, 40 a 120 min, dist\xE2ncias de 50 a 3000 m; Cross-promenade \u2014 m\xEDnimo de 3 km, 40 a 90 min, com aquecimento, desenvolvimento muscular, trabalho cont\xEDnuo e intervalado.","M\xE9todo INTERVALADO: est\xEDmulos de tiros, arrancadas e gestos esportivos; tempo de atividade at\xE9 5 min; 10 a 60 repeti\xE7\xF5es; recupera\xE7\xE3o incompleta; a\xE7\xE3o no intervalo ativa, recuperadora ou passiva. Varia\xE7\xF5es: lento (15\u201330 rep, 60\u201380% da velocidade m\xE1x.), r\xE1pido (esfor\xE7os anaer\xF3bicos l\xE1ticos de 40'' a 2'), sprints intervalados e acceleration sprint.","M\xE9todo FRACIONADO: aplica\xE7\xE3o de um segundo est\xEDmulo ap\xF3s a recupera\xE7\xE3o quase total do primeiro. Sprints repetidos (100\u2013400 m, intervalo 4\xD7 o tempo, 12\u201324 rep) e corridas repetidas (800\u20133000 m, recupera\xE7\xE3o 3\xD7 o tempo, 3\u201310 rep).","Benef\xEDcios do treino cardiovascular: redu\xE7\xE3o da gordura corporal; redu\xE7\xE3o da press\xE3o arterial e dos riscos card\xEDacos; maior utiliza\xE7\xE3o de gordura como fonte energ\xE9tica; aumento da economia de movimento."]},{titulo:"Bloco 4 \u2014 Treinamento de For\xE7a",paragrafos:["Conceito: a for\xE7a muscular \xE9 caracterizada pela presen\xE7a de uma resist\xEAncia aplicada ao sistema neuromuscular. Essa resist\xEAncia n\xE3o prov\xE9m necessariamente de aparelhos sofisticados, mas de qualquer implemento que ofere\xE7a resist\xEAncia ao m\xFAsculo.","Vari\xE1veis do treino de for\xE7a: ordem dos exerc\xEDcios, velocidade de execu\xE7\xE3o, n\xFAmero de s\xE9ries, n\xFAmero de repeti\xE7\xF5es, sobrecarga utilizada e per\xEDodo de recupera\xE7\xE3o.","Tipos de for\xE7a: Pura (esportes de movimentos ac\xEDclicos com alta exig\xEAncia de for\xE7a); Din\xE2mica (aumento da massa muscular); Explosiva (melhora da pot\xEAncia); Resist\xEAncia Muscular Localizada (melhora do t\xF4nus e da resist\xEAncia das fibras).","Benef\xEDcios: aumento da taxa metab\xF3lica, fortalecimento de tend\xF5es e ligamentos, preven\xE7\xE3o da perda de massa pela idade, aumento da densidade \xF3ssea, redu\xE7\xE3o do percentual de gordura, melhora do metabolismo da glicose, redu\xE7\xE3o/efeito hipotensor da press\xE3o arterial e melhora na economia de corrida.","M\xE9todos: (1) Circuito \u2014 6 a 15 esta\xE7\xF5es, alternando segmentos (bra\xE7o/perna), 1 a 3 voltas, 2 a 3x/semana; (2) TRM (Resist\xEAncia Muscular) \u2014 s\xE9ries para cada grupamento; b\xE1sico (peso corporal/companheiro) e avan\xE7ado (barras, anilhas, toros, fuzil); 3 fases (aquecimento espec\xEDfico, execu\xE7\xE3o, volta \xE0 calma); repeti\xE7\xE3o tern\xE1ria (1,2,3,0) e execu\xE7\xE3o em 4 tempos (3x1, 2x2, 1x1, 4x4); (3) Funcional \u2014 baseado no princ\xEDpio da instabilidade mec\xE2nica para gerar est\xEDmulo sens\xF3rio-motor, trabalhando os m\xFAsculos estabilizadores; (4) Muscula\xE7\xE3o \u2014 treino de for\xE7a em sala de equipamentos."]},{titulo:"Bloco 5 \u2014 Gin\xE1stica Preparat\xF3ria B\xE1sica e Condu\xE7\xE3o do TFM",paragrafos:["Composi\xE7\xE3o de uma sess\xE3o (cap 3): aquecimento articular geral, exerc\xEDcios de alongamento, exerc\xEDcios de aquecimento dos grupos musculares da atividade principal, treinamento aer\xF3bico, exerc\xEDcios neuromusculares e volta \xE0 calma.","Alongamento inicial: passivo ou est\xE1tico, a p\xE9 firme, durando em torno de 10 min, dividido em Aquecimento Articular e Alongamento Pr\xE9vio Muscular.","Aquecimento articular: iniciar de baixo para cima (membros inferiores, depois superiores); para cada articula\xE7\xE3o, unilateralmente, come\xE7ando pela ESQUERDA e depois a direita; movimentos circulares lentos (~8 giros) no sentido hor\xE1rio e depois no inverso, com pequena amplitude.","Volta \xE0 calma: alongamento passivo/est\xE1tico com dura\xE7\xE3o de 5 a 15 min, executando de 30 s a 1 min por grupamento muscular.","Crit\xE9rios para condu\xE7\xE3o: Uniforme, Postura, Voz de comando, Ser claro e Seguran\xE7a. Express\xF5es verbais: claras, concisas e precisas; usar afastar, aproximar, flexionar e estender; evitar abrir, fechar e dobrar.","A Gin\xE1stica Preparat\xF3ria B\xE1sica visa o aquecimento propriamente dito. Sequ\xEAncia: B-1 pesco\xE7o; B-2 eleva\xE7\xE3o lateral dos bra\xE7os; B-3 flex\xE3o do tronco; B-4 flex\xE3o sobre o solo; B-5 abdominal superior; B-6 agachamento b\xE1sico; B-7 abdominal inferior/prancha; B-8 agachamento unilateral; B-9 panturrilha; B-10 corrida no mesmo lugar; B-11 polichinelo. Vocativos: 'Permiss\xE3o para iniciar a Gin\xE1stica Preparat\xF3ria B\xE1sica' / 'Pronto da Gin\xE1stica Preparat\xF3ria B\xE1sica'."]},{titulo:"Bloco 6 \u2014 Legisla\xE7\xE3o (TAF-A) e Aspecto Militar",paragrafos:["Normas gerais: o TFM deve ser realizado diariamente nas OM; em condi\xE7\xF5es excepcionais, no m\xEDnimo 3 vezes por semana (1.2.3). As OM designam Comiss\xF5es de TAF-a (1.2.5). O Comandante ou Diretor \xE9 respons\xE1vel por criar condi\xE7\xF5es que assegurem a higidez f\xEDsica da Tripula\xE7\xE3o (1.2.11). Militares com 50 anos ou mais ficam desobrigados do TAF-a (1.2.12).","Periodiza\xE7\xE3o (3.7): fatores que influenciam a estrutura\xE7\xE3o \u2014 n\xEDvel de aptid\xE3o inicial, disponibilidade de tempo e objetivo a ser alcan\xE7ado.","TAF-a (5.1\u20135.2): verifica o grau de condicionamento f\xEDsico, aplicado por Comiss\xE3o de Avalia\xE7\xE3o da OM, em pista de atletismo ou \xE1rea plana demarcada e em piscina de 50 ou 25 m. Deve ser realizado anualmente at\xE9 20 de outubro. Para o CFN (ambos os sexos): corrida, nata\xE7\xE3o, perman\xEAncia dentro da \xE1gua, flex\xE3o na barra (homens; pode trocar por flex\xE3o de bra\xE7os no solo), flex\xF5es de bra\xE7os no solo (mulheres e opcional para homens) e abdominal \u2014 em tr\xEAs dias n\xE3o consecutivos.","Impedimentos (5.2.6): militares com motivo justificado (miss\xE3o em Posto Oceanogr\xE1fico, R\xE1dio-Farol, Esta\xE7\xE3o Ant\xE1rtica; gestantes, baixados etc.) realizam o TAF-a assim que o motivo do impedimento deixar de existir; o teste realizado ap\xF3s a cessa\xE7\xE3o \xE9 retroativo \xE0 data do teste regular.","Fora da OM (5.2.8): at\xE9 6 meses (norma geral); superior a 6 e inferior a 12 meses (oficia \xE0 DPMM/CPesFN, c\xF3pia ao CEFAN); superior a 12 e inferior a 24 meses (ao menos 1 TAF-a); superior a 24 meses (ao menos 2 TAF-a); ou autoavalia\xE7\xE3o.","Relat\xF3rio (5.7): militares n\xE3o-CFN enviam por of\xEDcio ao CEFAN at\xE9 31/10 (e no SISDPMM-m\xF3dulo TAF); militares do CFN enviam por of\xEDcio ao CPesFN at\xE9 31 de outubro, com c\xF3pia ao CEFAN.","Aspecto Militar: os militares Fuzileiros Navais s\xE3o avaliados anualmente quanto \xE0 composi\xE7\xE3o corporal em setembro/outubro. Os classificados como 'insuficientes' geram MSG ao CEFAN at\xE9 31OUT e s\xE3o convocados para imers\xE3o de duas semanas de treinamento e conscientiza\xE7\xE3o."]}],Zm={nome:"TFM \u2014 CGCFN-108",filhos:[{nome:"1. Seguran\xE7a e Higiene",filhos:[{nome:"Sa\xFAde = bem-estar f\xEDsico e mental",filhos:[]},{nome:"Aptid\xE3o na Inspe\xE7\xE3o de Sa\xFAde",filhos:[]},{nome:"Local: sem acidentes + ventila\xE7\xE3o",filhos:[]},{nome:"Pr\xE9-TAF-a at\xE9 31/03 (turmas + carga)",filhos:[]},{nome:"Alimenta\xE7\xE3o",filhos:[{nome:"2h ap\xF3s grande refei\xE7\xE3o",filhos:[]},{nome:"Nunca em jejum (hipoglicemia)",filhos:[]},{nome:"Refei\xE7\xE3o leve 30 min antes",filhos:[]},{nome:"Hidratar 35 mL/kg",filhos:[]}]},{nome:"For\xE7a com seguran\xE7a",filhos:[{nome:"T\xE9cnica adequada",filhos:[]},{nome:"N\xE3o exceder peso prescrito",filhos:[]},{nome:"Respira\xE7\xE3o correta (evitar Valsalva)",filhos:[]}]},{nome:"Benef\xEDcios do aquecimento",filhos:[{nome:"Reduz viscosidade sangu\xEDnea",filhos:[]},{nome:"Lubrifica articula\xE7\xF5es",filhos:[]},{nome:"Estimula sistema energ\xE9tico",filhos:[]}]}]},{nome:"2. Princ\xEDpios do Treinamento",filhos:[{nome:"Individualidade (Gen\xF3tipo+Fen\xF3tipo)",filhos:[]},{nome:"Adapta\xE7\xE3o (Treino\u2192Est\xEDmulo\u2192Adapta\xE7\xE3o)",filhos:[]},{nome:"Sobrecarga (estresse crescente)",filhos:[]},{nome:"Interdepend\xEAncia V\xD7I (inversos)",filhos:[]},{nome:"Continuidade (revers\xEDvel)",filhos:[]},{nome:"Especificidade",filhos:[]},{nome:"Aer\xF3bio (componentes)",filhos:[{nome:"15 a 60 min",filhos:[]},{nome:"55 a 90% FC m\xE1x",filhos:[]},{nome:"FC = \xF3timo par\xE2metro",filhos:[]}]}]},{nome:"3. Cardiovascular",filhos:[{nome:"Aer\xF3bico 20\u201360 min (corrida, nata\xE7\xE3o, ciclismo, lutas)",filhos:[]},{nome:"Corrida \u22652x/sem; Nata\xE7\xE3o \u22652x/sem, 500 m",filhos:[]},{nome:"FCM = 220 \u2212 idade",filhos:[]},{nome:"Cont\xEDnuo (volume)",filhos:[{nome:"Fartlek 40\u2013120 min",filhos:[]},{nome:"Cross-promenade \u22653 km, 40\u201390 min",filhos:[]}]},{nome:"Intervalado",filhos:[{nome:"At\xE9 5 min; 10\u201360 rep",filhos:[]},{nome:"Recupera\xE7\xE3o incompleta",filhos:[]}]},{nome:"Fracionado (recupera\xE7\xE3o quase total)",filhos:[]},{nome:"Benef\xEDcios",filhos:[{nome:"\u2193 gordura corporal",filhos:[]},{nome:"\u2193 PA e riscos card\xEDacos",filhos:[]},{nome:"+ uso de gordura como energia",filhos:[]},{nome:"+ economia de movimento",filhos:[]}]}]},{nome:"4. For\xE7a",filhos:[{nome:"Resist\xEAncia ao sistema neuromuscular",filhos:[]},{nome:"Tipos",filhos:[{nome:"Pura (ac\xEDclicos)",filhos:[]},{nome:"Din\xE2mica (massa)",filhos:[]},{nome:"Explosiva (pot\xEAncia)",filhos:[]},{nome:"RML (t\xF4nus/resist\xEAncia)",filhos:[]}]},{nome:"M\xE9todos",filhos:[{nome:"Circuito (6\u201315 esta\xE7\xF5es)",filhos:[]},{nome:"TRM (b\xE1sico/avan\xE7ado; tern\xE1ria 1,2,3,0)",filhos:[]},{nome:"Funcional (instabilidade mec\xE2nica)",filhos:[]},{nome:"Muscula\xE7\xE3o",filhos:[]}]}]},{nome:"5. Gin\xE1stica Preparat\xF3ria e Condu\xE7\xE3o",filhos:[{nome:"Sess\xE3o (6 partes)",filhos:[{nome:"Aquecimento articular",filhos:[]},{nome:"Alongamento",filhos:[]},{nome:"Aquecimento dos grupos musculares",filhos:[]},{nome:"Treinamento aer\xF3bico",filhos:[]},{nome:"Neuromusculares",filhos:[]},{nome:"Volta \xE0 calma",filhos:[]}]},{nome:"Articular: baixo\u2192cima, esquerda primeiro, ~8 giros",filhos:[]},{nome:"Volta \xE0 calma: 5\u201315 min; 30 s\u20131 min/grupo",filhos:[]},{nome:"Crit\xE9rios: Uniforme, Postura, Voz, Claro, Seguran\xE7a",filhos:[]},{nome:"Usar afastar/aproximar/flexionar/estender; evitar abrir/fechar/dobrar",filhos:[]}]},{nome:"6. Legisla\xE7\xE3o (TAF-A)",filhos:[{nome:"TFM di\xE1rio; m\xEDn. 3x/sem (1.2.3)",filhos:[]},{nome:"Comandante/Diretor: higidez (1.2.11)",filhos:[]},{nome:"\u226550 anos: desobrigados (1.2.12)",filhos:[]},{nome:"TAF-a at\xE9 20/out; pista + piscina 50/25 m",filhos:[]},{nome:"CFN: 3 dias n\xE3o consecutivos",filhos:[]},{nome:"CFN envia ao CPesFN at\xE9 31/10, c\xF3pia CEFAN",filhos:[]},{nome:"Aspecto Militar (set/out); insuf.\u2192imers\xE3o 2 sem",filhos:[]}]}]},$0=[{t:"Conceito de sa\xFAde",c:"O conceito atual de sa\xFAde envolve o completo bem-estar f\xEDsico e mental, e n\xE3o apenas a aus\xEAncia de alguma enfermidade (2.2)."},{t:"Aptid\xE3o / Inspe\xE7\xE3o de Sa\xFAde",c:"Os militares dever\xE3o estar APTOS nas Inspe\xE7\xF5es de Sa\xFAde para que possam cumprir os exerc\xEDcios do TFM (1.2.6)."},{t:"Local do TFM",c:"O TFM dever\xE1 ser conduzido em local que evite acidentes aos praticantes e que proporcione condi\xE7\xF5es de ventila\xE7\xE3o adequada (1.2.7)."},{t:"Pr\xE9-TAF-a",c:"Anualmente, at\xE9 31/03, todas as OM dever\xE3o efetuar o Pr\xE9-teste de Avalia\xE7\xE3o F\xEDsica Anual (Pr\xE9-TAF-a). Os resultados servem para a divis\xE3o em turmas e para o dimensionamento da carga f\xEDsica (1.2.10)."},{t:"Hor\xE1rio do TFM",c:"De prefer\xEAncia pela manh\xE3; quando n\xE3o for poss\xEDvel, deve iniciar cerca de 2 horas ap\xF3s o t\xE9rmino das principais refei\xE7\xF5es (almo\xE7o e jantar) (1.2.8)."},{t:"Clima e umidade",c:"Em regi\xF5es/esta\xE7\xF5es com temperaturas muito baixas ou elevadas, treinar nos hor\xE1rios de temperatura amena, com aten\xE7\xE3o \xE0 umidade relativa do ar (1.2.8)."},{t:"Jejum",c:"N\xE3o praticar nenhuma atividade f\xEDsica em jejum: al\xE9m de n\xE3o favorecer a redu\xE7\xE3o de massa corporal, pode levar \xE0 hipoglicemia e desmaios (2.3.3)."},{t:"Refei\xE7\xE3o pr\xE9-treino",c:"Realizar uma refei\xE7\xE3o leve trinta minutos antes do exerc\xEDcio (2.3.3)."},{t:"Hidrata\xE7\xE3o",c:"Hidratar-se consumindo 35 mL por kg de peso corporal (2.3.1)."},{t:"Medidas de seguran\xE7a na for\xE7a",c:"(a) t\xE9cnica adequada de levantamento; (b) evitar elevar pesos acima do prescrito pelo Instrutor/Guia; (c) respira\xE7\xE3o correta, evitando a Manobra de Valsalva (2.5.6)."},{t:"Manobra de Valsalva",c:"Bloqueio da respira\xE7\xE3o, que resulta em aumento na press\xE3o arterial durante a execu\xE7\xE3o dos exerc\xEDcios."},{t:"Mioc\xE1rdio",c:"O m\xFAsculo card\xEDaco \xE9 denominado mioc\xE1rdio, considerado o m\xFAsculo mais importante do corpo; como todo m\xFAsculo, precisa ser exercitado (2.6.1)."},{t:"Medida da FC",c:"A FC \xE9 medida em p\xE9, sentado ou deitado, durante 15 s em repouso; multiplicando-se o resultado por 4 obt\xE9m-se o valor em BPM (2.6.2)."},{t:"FC m\xE1xima",c:"FCM ou FCmax = 220 \u2212 idade (em bpm). A f\xF3rmula, apesar de n\xE3o t\xE3o precisa, confere estimativa para treinar com seguran\xE7a (2.6.2)."},{t:"Normas de execu\xE7\xE3o cardiovascular",c:"N\xE3o executar ap\xF3s almo\xE7o/jantar; permanecer 3 semanas em cada n\xEDvel; executar aquecimento, gin\xE1stica preparat\xF3ria e volta \xE0 calma; ingerir \xE1gua antes e depois; medir FC antes e imediatamente ap\xF3s; regras de rein\xEDcio em caso de interrup\xE7\xE3o."},{t:"Benef\xEDcios do aquecimento",c:"Redu\xE7\xE3o da viscosidade sangu\xEDnea; lubrifica\xE7\xE3o das articula\xE7\xF5es; est\xEDmulo do sistema energ\xE9tico a ser solicitado (3.6.1)."},{t:"Individualidade Biol\xF3gica",c:"Cada ser humano possui estrutura e forma\xE7\xE3o f\xEDsica pr\xF3prias (Gen\xF3tipo + Fen\xF3tipo). Um mesmo treino resulta em efeitos diferentes para cada indiv\xEDduo (3.4)."},{t:"Adapta\xE7\xE3o",c:"O organismo estimulado produz adapta\xE7\xF5es metab\xF3licas e fisiol\xF3gicas: Treino \u2192 Est\xEDmulo \u2192 Adapta\xE7\xE3o (3.4)."},{t:"Sobrecarga",c:"Os est\xEDmulos devem impor estresse crescente ao organismo; cargas constantes deixam de ter efeito positivo. Aplica-se aumentando o volume ou a intensidade (3.4)."},{t:"Interdepend\xEAncia Volume-Intensidade",c:"Volume e intensidade s\xE3o inversamente proporcionais; quando o volume aumenta, a intensidade diminui e vice-versa (3.4)."},{t:"Continuidade",c:"Os efeitos do treinamento s\xE3o transit\xF3rios e revers\xEDveis; revertem-se caso o indiv\xEDduo se torne inativo (3.4)."},{t:"Especificidade",c:"Os efeitos do treinamento s\xE3o espec\xEDficos para as partes e sistemas corporais solicitados na atividade (3.4)."},{t:"Dura\xE7\xE3o do aer\xF3bio",c:"Treinos aer\xF3bios t\xEAm dura\xE7\xE3o de 15 a 60 min, cont\xEDnuos ou intervalados, dependendo da intensidade (2.4.1)."},{t:"Intensidade do aer\xF3bio",c:"Intensidades variando entre 55 e 90% da frequ\xEAncia card\xEDaca m\xE1xima (2.4.1)."},{t:"Treinamento aer\xF3bico (3.6)",c:"Compreende corrida, nata\xE7\xE3o, ciclismo e lutas, com dura\xE7\xE3o de 20 a 60 min."},{t:"Treino de corrida",c:"Deve constar nos programas com frequ\xEAncia de pelo menos 2 vezes/semana (4.5.1)."},{t:"Treino de nata\xE7\xE3o",c:"Pelo menos 2x por semana, em dias n\xE3o consecutivos, nadando pelo menos 500 m em cada (4.5.1)."},{t:"M\xE9todo cont\xEDnuo \u2014 Fartlek",c:"Corrida composta de dist\xE2ncias e velocidades vari\xE1veis, com dura\xE7\xE3o de 40 a 120 min; dist\xE2ncias de 50 at\xE9 3000 m (predom\xEDnio do volume)."},{t:"M\xE9todo cont\xEDnuo \u2014 Cross-promenade",c:"M\xEDnimo de 3 km, dura\xE7\xE3o de 40 a 90 min; composto de aquecimento, desenvolvimento muscular, trabalho cont\xEDnuo e trabalho intervalado."},{t:"M\xE9todo intervalado",c:"Composto de est\xEDmulos de tiros, arrancadas e gestos esportivos; tempo de atividade at\xE9 5 min; 10 a 60 repeti\xE7\xF5es; recupera\xE7\xE3o incompleta; a\xE7\xE3o no intervalo ativa, recuperadora ou passiva."},{t:"M\xE9todo fracionado",c:"Aplica\xE7\xE3o de um segundo est\xEDmulo ap\xF3s a recupera\xE7\xE3o quase total dos efeitos do primeiro. Ex.: sprints repetidos e corridas repetidas."},{t:"Benef\xEDcios do cardiovascular",c:"Redu\xE7\xE3o da gordura corporal; redu\xE7\xE3o da press\xE3o arterial e de riscos card\xEDacos; maior utiliza\xE7\xE3o de gordura como fonte energ\xE9tica; aumento da economia de movimento."},{t:"Conceito de for\xE7a",c:"A for\xE7a muscular \xE9 caracterizada pela presen\xE7a de uma resist\xEAncia aplicada ao sistema neuromuscular (CGCFN-108)."},{t:"Tipos de for\xE7a",c:"Pura (movimentos ac\xEDclicos com alta exig\xEAncia de for\xE7a); Din\xE2mica (aumento de massa muscular); Explosiva (pot\xEAncia); RML (t\xF4nus e resist\xEAncia das fibras)."},{t:"M\xE9todo Circuito",c:"6 a 15 esta\xE7\xF5es, alternando o segmento de trabalho (bra\xE7o/perna); de 1 a 3 voltas; de 2 a 3 vezes na semana."},{t:"M\xE9todo TRM",c:"S\xE9ries para cada grupamento muscular. B\xE1sico: peso corporal ou de companheiro. Avan\xE7ado: barras, anilhas, toros ou fuzil. Possui 3 fases; repeti\xE7\xE3o tern\xE1ria (1,2,3,0); execu\xE7\xE3o em 4 tempos (3x1, 2x2, 1x1, 4x4)."},{t:"M\xE9todo Funcional",c:"Baseia-se no princ\xEDpio da instabilidade mec\xE2nica para gerar est\xEDmulo sens\xF3rio-motor, trabalhando os m\xFAsculos estabilizadores al\xE9m dos principais."},{t:"Composi\xE7\xE3o da sess\xE3o",c:"Aquecimento articular geral, exerc\xEDcios de alongamento, aquecimento dos grupos musculares da atividade principal, treinamento aer\xF3bico, exerc\xEDcios neuromusculares e volta \xE0 calma (cap 3)."},{t:"Aquecimento articular",c:"Iniciar de baixo para cima (membros inferiores, depois superiores); unilateralmente, come\xE7ando pela esquerda; movimentos circulares lentos (~8 giros), hor\xE1rio e depois inverso, com pequena amplitude."},{t:"Volta \xE0 calma",c:"Alongamento passivo/est\xE1tico com dura\xE7\xE3o de 5 a 15 min; de 30 s a 1 min por grupamento muscular."},{t:"Crit\xE9rios de condu\xE7\xE3o",c:"Uniforme, Postura, Voz de comando, Ser claro e Seguran\xE7a."},{t:"Express\xF5es verbais",c:"Devem ser claras, concisas e precisas. Usar: afastar, aproximar, flexionar e estender. Evitar: abrir, fechar e dobrar."},{t:"Vocativos da gin\xE1stica",c:"'Permiss\xE3o para iniciar a Gin\xE1stica Preparat\xF3ria B\xE1sica' (in\xEDcio) e 'Pronto da Gin\xE1stica Preparat\xF3ria B\xE1sica' (final)."},{t:"Frequ\xEAncia do TFM",c:"O TFM deve ser realizado diariamente nas OM; em condi\xE7\xF5es excepcionais, no m\xEDnimo 3 vezes por semana (1.2.3)."},{t:"Higidez f\xEDsica",c:"O Comandante ou Diretor \xE9 o respons\xE1vel por criar condi\xE7\xF5es que assegurem a higidez f\xEDsica da Tripula\xE7\xE3o (1.2.11)."},{t:"Desobriga\xE7\xE3o do TAF-a",c:"Militares com idade igual ou superior a 50 anos ficam desobrigados da realiza\xE7\xE3o do TAF-a (1.2.12)."},{t:"Prazo do TAF-a",c:"O TAF-a ser\xE1 realizado anualmente at\xE9 20 de outubro (5.2.1)."},{t:"Local do TAF-a",c:"Pista de atletismo ou \xE1rea plana previamente demarcada e piscina de 50 ou 25 m (5.2)."},{t:"Modalidades CFN",c:"Corrida, nata\xE7\xE3o, perman\xEAncia dentro da \xE1gua, flex\xE3o na barra (homens), flex\xF5es de bra\xE7os no solo (mulheres/opcional homens) e abdominal \u2014 em tr\xEAs dias n\xE3o consecutivos (5.2.3)."},{t:"Envio do resultado (CFN)",c:"Por meio de of\xEDcio ao CPesFN, at\xE9 31 de outubro, com c\xF3pia ao CEFAN (5.7.2)."},{t:"Aspecto Militar",c:"Composi\xE7\xE3o corporal avaliada em setembro/outubro. 'Insuficientes': MSG ao CEFAN at\xE9 31OUT e imers\xE3o de duas semanas de treinamento e conscientiza\xE7\xE3o (6.4.3)."}],Fm=[{n:1,p:"O atual conceito de sa\xFAde \xE9 tido somente como a aus\xEAncia de alguma enfermidade?",r:"N\xC3O. O conceito atual de sa\xFAde envolve o completo bem-estar f\xEDsico e mental, e n\xE3o apenas a aus\xEAncia de alguma enfermidade."},{n:2,p:"Qual cuidado devemos ter ao escolher um local p/ condu\xE7\xE3o do TFM?",r:"Selecionar local que evite acidentes aos praticantes e que proporcione condi\xE7\xE3o de ventila\xE7\xE3o adequada."},{n:3,p:"Quais cuidados alimentares s\xE3o citados como seguran\xE7a e higiene nesta aula?",r:"Para perfeita digest\xE3o, obede\xE7a ao repouso de 2 horas ap\xF3s uma grande refei\xE7\xE3o, n\xE3o praticar nenhuma atividade em jejum, realizar uma refei\xE7\xE3o leve 30 min antes do exerc\xEDcio e hidratar-se consumindo 35 mL/kg de peso corporal."},{n:4,p:"Cite alguns cuidados relacionados ao clima no TFM.",r:"Em regi\xF5es/esta\xE7\xF5es com temperaturas muito baixas ou elevadas, o TFM dever\xE1 ser realizado nos hor\xE1rios em que a temperatura estiver amena; aten\xE7\xE3o tamb\xE9m \xE0s condi\xE7\xF5es da umidade relativa do ar; considerar a intensidade da atividade e as pausas para hidrata\xE7\xE3o."},{n:5,p:"Por que os militares dever\xE3o estar aptos na Inspe\xE7\xE3o de Sa\xFAde para cumprir os exerc\xEDcios do TFM?",r:"(Responda com suas palavras.) Porque o TFM imp\xF5e esfor\xE7os f\xEDsicos e a aptid\xE3o na inspe\xE7\xE3o garante que o militar tem condi\xE7\xF5es de sa\xFAde para execut\xE1-los sem risco, cumprindo o programa com seguran\xE7a."},{n:6,p:"Cite os benef\xEDcios do aquecimento.",r:"Redu\xE7\xE3o da viscosidade sangu\xEDnea, lubrifica\xE7\xE3o das articula\xE7\xF5es e est\xEDmulo do sistema energ\xE9tico a ser solicitado."},{n:7,p:"Qual o perigo da realiza\xE7\xE3o de atividades f\xEDsicas em jejum?",r:"Pode levar \xE0 hipoglicemia e desmaios."},{n:8,p:"Quais medidas de seguran\xE7a devem ser consideradas no trabalho de for\xE7a?",r:"T\xE9cnica adequada de levantamento, evitar elevar pesos acima do prescrito pelo Instrutor/Guia e respira\xE7\xE3o correta."},{n:9,p:"O que vem a ser a manobra de Valsalva?",r:"Bloqueio da respira\xE7\xE3o, que resulta em aumento na press\xE3o arterial durante a execu\xE7\xE3o dos exerc\xEDcios."},{n:10,p:"Cite normas p/ execu\xE7\xE3o de exerc\xEDcios cardiovasculares.",r:"N\xE3o executar ap\xF3s almo\xE7o e jantar; permanecer tr\xEAs semanas em cada n\xEDvel; executar aquecimento, gin\xE1stica preparat\xF3ria e volta \xE0 calma; ingerir \xE1gua antes e depois; se interrompido por at\xE9 tr\xEAs semanas, reiniciar a partir da 1\xAA semana correspondente ao n\xEDvel em que foi interrompido."},{n:11,p:"Cada ser humano possui estrutura e forma\xE7\xE3o f\xEDsica pr\xF3prias; qual princ\xEDpio precisamos respeitar?",r:"Princ\xEDpio da Individualidade."},{n:12,p:"Qual princ\xEDpio deve ser aplicado para que ocorram adapta\xE7\xF5es progressivas sem dano ao aluno?",r:"Princ\xEDpio da Adapta\xE7\xE3o."},{n:13,p:"Em m\xE9dia, qual a dura\xE7\xE3o indicada para atividades aer\xF3bias?",r:"15 a 60 min."},{n:14,p:"Como podemos aplicar o princ\xEDpio da sobrecarga?",r:"Aumentando o volume ou a intensidade do treinamento."},{n:15,p:"O SD Antunes usou a mesma carga dos colegas experientes, n\xE3o imp\xF4s estresse crescente e se lesionou. Qual princ\xEDpio n\xE3o foi respeitado?",r:"Princ\xEDpio da Sobrecarga."},{n:16,p:"Segundo a CGCFN-108 (2.6.2), o que \xE9 indicado como \xF3timo par\xE2metro para controlar a intensidade dos exerc\xEDcios?",r:"Frequ\xEAncia card\xEDaca."},{n:17,p:"Cite dois par\xE2metros para aumentar o volume do treinamento.",r:"Aumentar a quantidade de repeti\xE7\xF5es e aumentar o tempo da atividade."},{n:18,p:"Em qual princ\xEDpio o volume e a intensidade s\xE3o inversamente proporcionais?",r:"Princ\xEDpio da Interdepend\xEAncia Volume \xD7 Intensidade."},{n:19,p:"O CB Wilson foi reprovado na corrida e foi inscrito em barra/abd. Qual princ\xEDpio o instrutor n\xE3o aplicou?",r:"Princ\xEDpio da Especificidade."},{n:20,p:"O CB Pimenta foi reprovado por falta de treino entre um TAF e outro. Qual princ\xEDpio n\xE3o foi aplicado?",r:"Princ\xEDpio da Continuidade."},{n:21,p:"O treinamento de corrida dever\xE1 constar nos programas de TFM com a frequ\xEAncia de pelo menos\u2026",r:"2 vezes/semana."},{n:22,p:"O treinamento aer\xF3bico (corrida, nata\xE7\xE3o, ciclismo, lutas) tem dura\xE7\xE3o de\u2026",r:"20 a 60 min."},{n:23,p:"Como se chama o princ\xEDpio que op\xF5e volume e intensidade?",r:"Interdepend\xEAncia."},{n:24,p:"M\xE9todos de treinamento cardiovascular \u2014 m\xE9todo cont\xEDnuo. Cite exemplos.",r:"Fartlek e Cross-promenade."},{n:25,p:"Cite benef\xEDcios do treino cardiovascular.",r:"Redu\xE7\xE3o da gordura corporal; redu\xE7\xE3o da press\xE3o arterial e de riscos card\xEDacos; maior utiliza\xE7\xE3o de gordura como fonte energ\xE9tica; aumento
